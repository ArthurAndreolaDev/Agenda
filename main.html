<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <h1>Agenda EBAC</h1>
    <form id="event-form">
        <input type="text" name="title" placeholder="Nome do Contato" required id="nome">
        <input type="tel" name="telefone" placeholder="Número de Telefone" required id="numero">
        <button type="submit">Adicionar</button>
    </form>
    <div class="container">
      <table>
        <thead>
          <tr>
            <th>
              Lista de Contatos
            </th>
          </tr>
        </thead>
        <tbody id="corpo">
          <tr>
            <td>Nome do Contato</td>
            <td>Número do Contato</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="main.js"></script>
</body>
</html>
